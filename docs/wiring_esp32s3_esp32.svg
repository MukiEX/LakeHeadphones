<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  --paper: #f6f7f4;
  --grid: #e3e7df;
  --ink: #1d2422;
  --muted: #5d6762;
  --board: #ffffff;
  --board-edge: #2f3a36;
  --chip: #dfe5e1;
  --accent: #0b6e4f;
  --w-bclk: #c98a00;
  --w-ws: #7b3fb5;
  --w-data: #1f6fd1;
  --w-gnd: #2b2b2b;
  --w-5v: #c8322b;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark) { svg {
  --paper: #141a18; --grid: #1f2724; --ink: #e6ece8; --muted: #9aa7a0;
  --board: #1b2321; --board-edge: #a9b8b0; --chip: #2a3431; --accent: #4cc79a;
  --w-bclk: #f0b429; --w-ws: #b98ae6; --w-data: #5aa2ff; --w-gnd: #cfd6d2; --w-5v: #ff6b5f;
  
} }
.bg { fill: var(--paper); }
svg text { font-family: var(--mono); fill: var(--ink); }
svg .t-muted { fill: var(--muted); }
svg .t-title { font-family: var(--display); font-weight: 800; }
svg .board { fill: var(--board); stroke: var(--board-edge); stroke-width: 2; }
svg .chip { fill: var(--chip); stroke: var(--board-edge); stroke-width: 1; }
svg .pad { fill: var(--paper); stroke: var(--board-edge); stroke-width: 1.5; }
svg .pin { fill: var(--board-edge); }
svg .outline { fill: none; stroke: var(--board-edge); stroke-width: 1.6; }
svg .usb { fill: var(--chip); stroke: var(--board-edge); stroke-width: 1.4; }
svg .cable { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; }
svg .wave { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
svg .w { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
svg .bclk { stroke: var(--w-bclk); } svg .ws { stroke: var(--w-ws); } svg .data { stroke: var(--w-data); }
svg .gnd { stroke: var(--w-gnd); } svg .v5 { stroke: var(--w-5v); stroke-dasharray: 9 6; }
svg .lbl-bg { fill: var(--paper); }
svg .fill-accent { fill: var(--accent); }
  svg .wave { animation: pulse 2.4s ease-in-out infinite; }
  svg .wave.d2 { animation-delay: .3s; } svg .wave.d3 { animation-delay: .6s; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
</style>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>
        <!-- PC -->
        <g transform="translate(28,34)">
          <rect class="outline" x="0" y="0" width="120" height="76" rx="5"/>
          <rect class="chip" x="10" y="10" width="100" height="52" rx="2"/>
          <rect class="outline" x="44" y="76" width="32" height="10"/>
          <rect class="outline" x="30" y="86" width="60" height="6" rx="2"/>
          <text x="60" y="41" text-anchor="middle" font-size="13" font-weight="600">PC</text>
          <text x="60" y="114" text-anchor="middle" font-size="11.5" class="t-muted">plays 5.1 audio</text>
        </g>
        <!-- cable PC -> S3 USB -->
        <path class="cable" d="M88 152 C 88 200, 150 210, 150 232"/>
        <text x="80" y="204" text-anchor="end" font-size="11" class="t-muted">USB-C</text>

        <!-- ESP32-S3 board -->
        <g transform="translate(60,232)">
          <rect class="board" x="0" y="0" width="290" height="190" rx="8"/>
          <rect class="usb" x="70" y="-8" width="34" height="14" rx="3"/>
          <text x="87" y="-14" text-anchor="middle" font-size="10.5" font-weight="600">USB</text>
          <rect class="usb" x="160" y="-8" width="34" height="14" rx="3"/>
          <text x="177" y="-14" text-anchor="middle" font-size="10.5" class="t-muted">UART</text>
          <rect class="chip" x="30" y="40" width="110" height="80" rx="3"/>
          <text x="85" y="76" text-anchor="middle" font-size="12" font-weight="600">ESP32-S3</text>
          <text x="85" y="93" text-anchor="middle" font-size="10.5" class="t-muted">USB + DSP</text>
          <text x="14" y="176" font-size="12" class="t-title">ESP32-S3-DevKitC-1</text>
          <!-- header pins on the right edge -->
          <g font-size="12">
            <circle class="pad" cx="270" cy="34" r="7"/><text x="256" y="38" text-anchor="end">GPIO5</text>
            <circle class="pad" cx="270" cy="64" r="7"/><text x="256" y="68" text-anchor="end">GPIO6</text>
            <circle class="pad" cx="270" cy="94" r="7"/><text x="256" y="98" text-anchor="end">GPIO7</text>
            <circle class="pad" cx="270" cy="124" r="7"/><text x="256" y="128" text-anchor="end">GND</text>
            <circle class="pad" cx="270" cy="154" r="7"/><text x="256" y="158" text-anchor="end">5V</text>
          </g>
          <circle class="pad" cx="200" cy="150" r="9"/><text x="186" y="154" text-anchor="end" font-size="10.5" class="t-muted">BOOT: tap room · hold LL</text>
        </g>

        <!-- ESP32 board -->
        <g transform="translate(610,232)">
          <rect class="board" x="0" y="0" width="290" height="190" rx="8"/>
          <rect class="usb" x="128" y="182" width="34" height="14" rx="3"/>
          <text x="145" y="214" text-anchor="middle" font-size="10.5" class="t-muted">micro-USB (flash / power)</text>
          <rect class="chip" x="150" y="40" width="110" height="80" rx="3"/>
          <text x="205" y="76" text-anchor="middle" font-size="12" font-weight="600">ESP32</text>
          <text x="205" y="93" text-anchor="middle" font-size="10.5" class="t-muted">Bluetooth A2DP</text>
          <text x="190" y="150" font-size="12" class="t-title">ESP32-DevKitC</text>
          <text x="190" y="166" font-size="10.5" class="t-muted">WROOM-32</text>
          <g font-size="12">
            <circle class="pad" cx="20" cy="34" r="7"/><text x="34" y="38">GPIO26</text>
            <circle class="pad" cx="20" cy="64" r="7"/><text x="34" y="68">GPIO25</text>
            <circle class="pad" cx="20" cy="94" r="7"/><text x="34" y="98">GPIO22</text>
            <circle class="pad" cx="20" cy="124" r="7"/><text x="34" y="128">GND</text>
            <circle class="pad" cx="20" cy="154" r="7"/><text x="34" y="158">5V</text>
          </g>
          <circle class="pad" cx="110" cy="164" r="9"/><text x="110" y="146" text-anchor="middle" font-size="10.5" class="t-muted">hold BOOT = re-pair</text>
        </g>

        <!-- wires -->
        <path class="w bclk" d="M330 266 H 630"/>
        <path class="w ws"   d="M330 296 H 630"/>
        <path class="w data" d="M330 326 H 630"/>
        <path class="w gnd"  d="M330 356 H 630"/>
        <path class="w v5"   d="M330 386 H 630"/>
        <g font-size="11.5" font-weight="600">
          <rect class="lbl-bg" x="421" y="252" width="118" height="16"/><text x="480" y="264" text-anchor="middle">BCLK 3.072 MHz</text>
          <rect class="lbl-bg" x="414" y="282" width="133" height="16"/><text x="480" y="294" text-anchor="middle">WS / LRCK 48 kHz</text>
          <rect class="lbl-bg" x="443" y="312" width="74" height="16"/><text x="480" y="324" text-anchor="middle">I2S DATA</text>
          <rect class="lbl-bg" x="461" y="342" width="38" height="16"/><text x="480" y="354" text-anchor="middle">GND</text>
          <rect class="lbl-bg" x="425" y="372" width="111" height="16"/><text x="480" y="384" text-anchor="middle">5V (optional)</text>
        </g>
        <text x="480" y="236" text-anchor="middle" font-size="11" class="t-muted">S3 is I2S master → ESP32 is slave</text>

        <!-- headset + BT waves -->
        <g transform="translate(748,40)">
          <path class="outline" d="M10 70 V 52 A 50 50 0 0 1 110 52 V 70" stroke-width="5"/>
          <rect class="chip" x="0" y="62" width="22" height="40" rx="8"/>
          <rect class="chip" x="98" y="62" width="22" height="40" rx="8"/>
          <text x="60" y="128" text-anchor="middle" font-size="11.5" class="t-muted">your BT headset</text>
        </g>
        <g transform="translate(790,190)">
          <path class="wave"    d="M0 20 Q 18 0 36 20"/>
          <path class="wave d2" d="M-8 32 Q 18 -6 44 32"/>
          <path class="wave d3" d="M-16 44 Q 18 -12 52 44"/>
        </g>
        <text x="866" y="214" font-size="11" class="fill-accent" font-weight="600">A2DP / SBC</text>
      </svg>
