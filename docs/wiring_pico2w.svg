<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 240" xmlns="http://www.w3.org/2000/svg">
<style>
svg {
  --paper: #f6f7f4;
  --grid: #e3e7df;
  --ink: #1d2422;
  --muted: #5d6762;
  --board: #ffffff;
  --board-edge: #2f3a36;
  --chip: #dfe5e1;
  --accent: #0b6e4f;
  --w-bclk: #c98a00;
  --w-ws: #7b3fb5;
  --w-data: #1f6fd1;
  --w-gnd: #2b2b2b;
  --w-5v: #c8322b;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;}
@media (prefers-color-scheme: dark) { svg {
  --paper: #141a18; --grid: #1f2724; --ink: #e6ece8; --muted: #9aa7a0;
  --board: #1b2321; --board-edge: #a9b8b0; --chip: #2a3431; --accent: #4cc79a;
  --w-bclk: #f0b429; --w-ws: #b98ae6; --w-data: #5aa2ff; --w-gnd: #cfd6d2; --w-5v: #ff6b5f;
  
} }
.bg { fill: var(--paper); }
svg text { font-family: var(--mono); fill: var(--ink); }
svg .t-muted { fill: var(--muted); }
svg .t-title { font-family: var(--display); font-weight: 800; }
svg .board { fill: var(--board); stroke: var(--board-edge); stroke-width: 2; }
svg .chip { fill: var(--chip); stroke: var(--board-edge); stroke-width: 1; }
svg .pad { fill: var(--paper); stroke: var(--board-edge); stroke-width: 1.5; }
svg .pin { fill: var(--board-edge); }
svg .outline { fill: none; stroke: var(--board-edge); stroke-width: 1.6; }
svg .usb { fill: var(--chip); stroke: var(--board-edge); stroke-width: 1.4; }
svg .cable { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; }
svg .wave { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linecap: round; }
svg .w { fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
svg .bclk { stroke: var(--w-bclk); } svg .ws { stroke: var(--w-ws); } svg .data { stroke: var(--w-data); }
svg .gnd { stroke: var(--w-gnd); } svg .v5 { stroke: var(--w-5v); stroke-dasharray: 9 6; }
svg .lbl-bg { fill: var(--paper); }
svg .fill-accent { fill: var(--accent); }
  svg .wave { animation: pulse 2.4s ease-in-out infinite; }
  svg .wave.d2 { animation-delay: .3s; } svg .wave.d3 { animation-delay: .6s; }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
</style>
<rect class="bg" x="0" y="0" width="100%" height="100%"/>
        <g transform="translate(220,40)">
          <rect class="board" x="0" y="0" width="420" height="120" rx="8"/>
          <rect class="usb" x="-10" y="44" width="22" height="32" rx="3"/>
          <text x="-18" y="66" text-anchor="end" font-size="11" class="t-muted">USB → PC</text>
          <rect class="chip" x="70" y="30" width="80" height="60" rx="3"/>
          <text x="110" y="64" text-anchor="middle" font-size="11.5" font-weight="600">RP2350</text>
          <rect class="chip" x="250" y="25" width="110" height="70" rx="3"/>
          <text x="305" y="58" text-anchor="middle" font-size="11.5" font-weight="600">CYW43439</text>
          <text x="305" y="75" text-anchor="middle" font-size="10.5" class="t-muted">BT Classic</text>
          <circle class="pad" cx="190" cy="92" r="9"/><text x="190" y="114" text-anchor="middle" font-size="10.5" class="t-muted">BOOTSEL: room · 2× LL</text>
          <circle class="pad" cx="30" cy="12" r="6"/><text x="30" y="-6" text-anchor="middle" font-size="11">GP0</text>
          <circle class="pad" cx="395" cy="108" r="6"/><text x="395" y="94" text-anchor="middle" font-size="11">GP15</text>
          <circle class="pad" cx="365" cy="108" r="6"/><text x="365" y="94" text-anchor="middle" font-size="11">GND</text>
        </g>
        <path class="w data" d="M615 148 V 180 H 690"/><path class="w gnd" d="M585 148 V 190 H 690"/>
        <g transform="translate(690,170)"><rect class="outline" x="0" y="0" width="54" height="30" rx="4"/><circle class="pin" cx="27" cy="15" r="7"/></g>
        <text x="717" y="226" text-anchor="middle" font-size="11.5" class="t-muted">optional button (-DLHP_BUTTON_GPIO=15)</text>
        <text x="250" y="22" font-size="11.5" class="t-muted">GP0 = UART TX logs, 115200 baud</text>
      </svg>
