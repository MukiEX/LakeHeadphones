# LakeHP 5.1 - LE Audio transmitter settings for Nordic's nrf_audio
# unicast client (nRF Connect SDK v3.4.x), on a plain nRF5340 DK.
# Use together with unicast_client/overlay-unicast_client.conf (see README.md).

# --- Input: processed stereo from the ESP32-S3 over I2S ---------------------
# nrf5340dk overlay: nRF5340 is I2S master, Philips format, 16-bit, 48 kHz.
#   P1.07 SCK -> S3 GPIO5,  P1.05 LRCK -> S3 GPIO6,  P1.09 SDIN <- S3 GPIO7
# With I2S as source the gateway trims its audio clock to the Bluetooth ISO
# timeline, so the S3 (I2S slave) and the PC (USB feedback) follow it too.
CONFIG_AUDIO_SOURCE_I2S=y
CONFIG_AUDIO_SAMPLE_RATE_48000_HZ=y
CONFIG_AUDIO_BIT_DEPTH_16=y

# --- Stereo to one headset ----------------------------------------------------
CONFIG_MONO_TO_ALL_RECEIVERS=n

# --- Latency ------------------------------------------------------------------
# Ask for the smallest presentation delay every connected headset accepts.
CONFIG_BT_AUDIO_PRES_DELAY_SRCH_MIN=y
# LC3 frames: 10 ms is Nordic's tested setting. 7.5 ms saves ~2.5 ms but is
# marked untested upstream and not every headset supports it:
#   CONFIG_AUDIO_FRAME_DURATION_7_5_MS=y
CONFIG_AUDIO_FRAME_DURATION_10_MS=y
# Per-channel LC3 bitrate (bit/s). 96 kbps is near-transparent at 48 kHz.
CONFIG_BT_AUDIO_BITRATE_UNICAST_SINK=96000

# --- Finding your headset -----------------------------------------------------
# Headsets only send their name in scan responses, so scan actively, and
# connect to the one whose advertised name matches CONFIG_BT_DEVICE_NAME.
# Put your headset's exact Bluetooth name here (as your phone shows it).
CONFIG_SCAN_MODE_ACTIVE=y
CONFIG_BT_MGMT_CONNECT_BY_NAME=y
CONFIG_BT_DEVICE_NAME="WF-1000XM5"
# Alternatively connect by address:
#   CONFIG_BT_MGMT_CONNECT_BY_ADDR=y
#   CONFIG_CONNECT_TO_BT_ADDR_LE_STR="AA:BB:CC:DD:EE:FF"
